services:
  db:
    image: postgres:16-alpine
    container_name: tsa_db
    restart: unless-stopped
    command: ["postgres", "-c", "password_encryption=md5"]
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: tsa_backend
    restart: unless-stopped
    networks:
      - tsa-network
    environment:
      MODE: prod
      DEBUG_ENABLED: 'False'
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      APP_PORT: 8040
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      # CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
    # Allows Django to write static and media files to the host
      - ./src/staticfiles:/app/src/staticfiles
      - ./src/media:/app/src/media
    depends_on:
      db:
        condition: service_healthy
  
  webserver:
    image: nginx:alpine
    container_name: tsa_nginx
    restart: unless-stopped
    ports:
      - "8040:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/staticfiles:/app/src/staticfiles:ro
      - ./src/media:/app/src/media:ro
    depends_on:
      - backend
    networks:
      - tsa-network

volumes:
  postgres_data:

networks:
  tsa-network:
    driver: bridge
